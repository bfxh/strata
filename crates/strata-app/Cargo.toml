[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strata-geo = { path = "../strata-geo" }
strata-field = { path = "../strata-field" }
strata-exec = { path = "../strata-exec" }
strata-nodes = { path = "../strata-nodes" }
strata-render = { path = "../strata-render" }
strata-gpu = { path = "../strata-gpu" }
strata-io = { path = "../strata-io" }
# x11/wayland：Linux 上 winit 后端由这两个 feature 选择（首轮 CI 判红实证）；
# windows/macos 后端恒编译不受影响。
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.31"
wgpu = "24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"
