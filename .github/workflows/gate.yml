name: gate
# 与本地 `cargo xtask gate` 等价（06：禁止 CI 独有步骤成为盲区）。
# GPU 面：C1/D1/D2 在无登记 GPU 的 runner 上按设计 SKIP 并在日志披露，
# 复现性断言与 selftest 负对照在所有平台恒判。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      # A1-A3/B1/D1/D2(selftest+bench) 全链，与本地同一入口
      - name: cargo xtask gate
        run: cargo run -q -p xtask -- gate

  # 依赖锁定单独钉一条（--locked 漂移即红；xtask gate 内已含，这里做早期快失败）
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: lockfile consistency
        run: cargo metadata --locked --format-version 1 >/dev/null

  # ⏳ 债务（gates.md 已记）：覆盖率下限/tarpaulin、A3 cargo-deny、跨平台 golden 分文件基线，
  # 首版不发防止假红掩盖真红，M2 一起接入。
